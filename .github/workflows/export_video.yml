name: HEVC alpha para Safari

on:
  workflow_dispatch:
    inputs:
      entrada:
        description: "Caminho do ficheiro de entrada no repositório"
        required: true
        default: "input/entrada.mov"
      cor:
        description: "Cor do fundo a remover (hex)"
        required: true
        default: "0x0D7A4C"
      similarity:
        description: "Tolerância do chromakey"
        required: true
        default: "0.10"
      bitrate:
        description: "Bitrate de vídeo"
        required: true
        default: "1500k"
      alpha_quality:
        description: "Qualidade do canal alpha (0-1)"
        required: true
        default: "0.65"
      limite_mb:
        description: "Tamanho máximo aceite (MB)"
        required: true
        default: "3"

jobs:
  encode:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Instalar ffmpeg
        run: brew install ffmpeg

      - name: Confirmar suporte a alpha no encoder
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -encoders | grep -q hevc_videotoolbox \
            || { echo "::error::hevc_videotoolbox indisponível"; exit 1; }
          FMTS=$(ffmpeg -hide_banner -h encoder=hevc_videotoolbox 2>&1 \
                 | grep -i "pixel formats" || true)
          echo "$FMTS"
          echo "$FMTS" | grep -q bgra \
            || { echo "::error::esta build não aceita bgra, não consegue alpha"; exit 1; }

      - name: Codificar
        env:
          ENTRADA: ${{ inputs.entrada }}
          COR: ${{ inputs.cor }}
          SIM: ${{ inputs.similarity }}
          BR: ${{ inputs.bitrate }}
          AQ: ${{ inputs.alpha_quality }}
        run: |
          set -euo pipefail
          test -f "$ENTRADA" || { echo "::error::'$ENTRADA' não existe"; exit 1; }
          mkdir -p out
          ffmpeg -hide_banner -y -i "$ENTRADA" \
            -vf "chromakey=${COR}:${SIM}:0.05,despill=type=green:mix=0.5:expand=0,format=rgba" \
            -c:v hevc_videotoolbox -b:v "$BR" -alpha_quality "$AQ" \
            -pix_fmt bgra -tag:v hvc1 -an \
            out/safari-alpha.mov

      - name: Verificar alpha, tag e tamanho
        env:
          LIMITE: ${{ inputs.limite_mb }}
        run: |
          set -euo pipefail
          F=out/safari-alpha.mov
          test -s "$F" || { echo "::error::ficheiro vazio"; exit 1; }

          PIX=$(ffprobe -v error -select_streams v:0 \
                -show_entries stream=pix_fmt -of csv=p=0 "$F")
          TAG=$(ffprobe -v error -select_streams v:0 \
                -show_entries stream=codec_tag_string -of csv=p=0 "$F")
          HVCE=$(grep -c hvcE "$F" || true)
          BYTES=$(stat -f%z "$F")
          MB=$(echo "scale=2; $BYTES/1048576" | bc)

          echo "pix_fmt=$PIX  tag=$TAG  hvcE=$HVCE  tamanho=${MB}MB"

          {
            echo "### Resultado"
            echo "- pix_fmt: \`$PIX\`"
            echo "- tag: \`$TAG\`"
            echo "- camada alpha (hvcE): \`$HVCE\`"
            echo "- tamanho: **${MB} MB** (limite ${LIMITE} MB)"
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$TAG" = "hvc1" ] \
            || { echo "::error::tag '$TAG', o Safari precisa de hvc1"; exit 1; }
          [ "$HVCE" -gt 0 ] \
            || { echo "::error::sem camada alpha — o ficheiro é opaco"; exit 1; }
          case "$PIX" in
            bgra|rgba|yuva*) ;;
            *) echo "::error::pix_fmt '$PIX' não tem alpha"; exit 1 ;;
          esac

          if (( $(echo "$MB > $LIMITE" | bc -l) )); then
            echo "::warning::${MB}MB acima do limite — baixa o bitrate e repete."
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: safari-alpha-mov
          path: out/safari-alpha.mov
          retention-days: 14
